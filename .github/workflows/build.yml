name: Build item lookup

on:
  workflow_dispatch:       # "Run workflow" button, also used by cron-job.org

permissions:
  contents: write          # lets the build save Divine Pride data (dp/ folder) into the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python build.py
        env:
          DP_API_KEY: ${{ secrets.DP_API_KEY }}
      - name: Save Divine Pride data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add dp
          git diff --cached --quiet || (git commit -m "Update Divine Pride monster data" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
